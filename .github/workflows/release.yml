name: Build & Release TD-Avatar-Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release Tag (e.g. v1.0.0)'
        required: true
        default: 'v1.0.0'

permissions:
  contents: write

jobs:
  build-linux:
    name: Build Linux x64
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Linux Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev liblzma-dev libasound2-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Run Tests
        run: flutter test

      - name: Build Linux Application
        run: flutter build linux --release

      - name: Package Linux Binary
        run: |
          mkdir -p dist
          tar -czvf dist/TD-Avatar-Studio-Linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload Linux Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TD-Avatar-Studio-Linux-x64
          path: dist/TD-Avatar-Studio-Linux-x64.tar.gz

  build-windows:
    name: Build Windows x64
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Windows Application
        run: flutter build windows --release

      - name: Package Windows Binary
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist
          $winPath = if (Test-Path "build\windows\x64\runner\Release") { "build\windows\x64\runner\Release\*" } else { "build\windows\runner\Release\*" }
          Compress-Archive -Path $winPath -DestinationPath dist\TD-Avatar-Studio-Windows-x64.zip

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TD-Avatar-Studio-Windows-x64
          path: dist/TD-Avatar-Studio-Windows-x64.zip

  build-macos:
    name: Build macOS Universal
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build macOS Application
        run: flutter build macos --release

      - name: Package macOS Binary
        run: |
          mkdir -p dist
          cd build/macos/Build/Products/Release
          zip -r ../../../../dist/TD-Avatar-Studio-macOS.zip *.app

      - name: Upload macOS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TD-Avatar-Studio-macOS
          path: dist/TD-Avatar-Studio-macOS.zip

  publish-release:
    name: Publish Multi-Platform GitHub Release
    needs: [build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Linux Artifact
        uses: actions/download-artifact@v4
        with:
          name: TD-Avatar-Studio-Linux-x64
          path: release_assets

      - name: Download Windows Artifact
        uses: actions/download-artifact@v4
        with:
          name: TD-Avatar-Studio-Windows-x64
          path: release_assets

      - name: Download macOS Artifact
        uses: actions/download-artifact@v4
        with:
          name: TD-Avatar-Studio-macOS
          path: release_assets

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.release_tag || github.ref_name }}
          name: "TD-Avatar-Studio ${{ github.event.inputs.release_tag || github.ref_name }} — Production Ready"
          draft: false
          prerelease: false
          files: release_assets/*
          body: |
            ## TD-Avatar-Studio Production Release
            Production-grade cross-platform 3D avatar workspace for OBS Studio livestreaming, Paystack & NOWPayments commercial licensing, and real-time deepfake/face-swap avatar streaming.

            ### Download Ready Binaries
            - **Linux (x64)**: `TD-Avatar-Studio-Linux-x64.tar.gz`
            - **Windows (x64)**: `TD-Avatar-Studio-Windows-x64.zip`
            - **macOS**: `TD-Avatar-Studio-macOS.zip`

            ### Commercial Studio Licensing
            - **1-Time Lifetime Commercial License**: **₦200,000 NGN** (or $135 USD crypto equivalent via NOWPayments)
            - **Gateways**: Paystack (Debit/Credit Cards, Bank Transfer) & NOWPayments (USDT, BTC, ETH, Solana, BNB)
            - **Access Code Format**: Cryptographically signed permanent license `TD-LIFE-XXXX-YYYY`
            - **No Recurring Fees**: Pay once, own forever
